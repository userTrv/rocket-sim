# Защита от атак через цепочку поставок (см. CLAUDE.md, «Зависимости»).

# Ставим только версии, опубликованные не меньше 7 дней назад (в минутах):
# за это время вредоносные релизы обычно успевают найти и отозвать.
minimumReleaseAge: 10080

# Не ставить версию, у которой доверие ниже, чем у предыдущих
# (например, раньше публиковалась из CI с provenance, а теперь вручную).
trustPolicy: no-downgrade

# Транзитивные зависимости только из реестра: без git-репозиториев и tarball по URL.
blockExoticSubdeps: true

# Скрипты установки (postinstall и т. п.) запрещены всем пакетам, а неразобранный
# скрипт роняет установку. Нужен пакету скрипт — проверить его и добавить
# в onlyBuiltDependencies; не нужен — в ignoredBuiltDependencies.
strictDepBuilds: true
onlyBuiltDependencies: []
